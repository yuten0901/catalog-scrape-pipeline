<!doctype html>
<!--
  The single most common way a working scraper dies: the site was redesigned.

  This page is a perfectly healthy HTTP 200 full of products. The record
  selector configured for it (`article.product`) matches nothing, because the
  markup is now `<li class="card">`.

  A scraper that reports "0 products" here has failed *silently* — the client
  sees a smaller CSV and no error. This pipeline reports the page as a
  `no_records` failure, which is a non-zero exit code and a named line in the
  run report. See docs/data-quality.md, "empty is not the same as broken".
-->
