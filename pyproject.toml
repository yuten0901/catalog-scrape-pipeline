[project]
name = "catalog-scrape-pipeline"
version = "1.0.0"
description = "A configurable scraping pipeline that turns messy catalogue pages into clean CSV/JSON, and reports everything it could not."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yuten" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "playwright>=1.44",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
    "lxml-stubs",
]

[project.scripts]
catalog-scrape = "catalog_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog_scraper*", "demo_site*"]

[tool.setuptools.package-data]
demo_site = ["pages/*.html", "pages/*.txt"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # A test that neither passes nor fails is not evidence. Anything that
    # silently becomes a no-op (an empty parametrize set, a fixture that
    # collects nothing) is an error rather than a green dot.
    "--import-mode=importlib",
]
markers = [
    "browser: needs a real Playwright browser binary (see docs/test-strategy.md)",
]
xfail_strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RET",      # return values
    "PTH",      # pathlib over os.path
    "TID",      # tidy imports
    "ARG",      # unused arguments
    "DTZ",      # naive datetimes -- this project compares runs across days
    "T20",      # no stray print() outside the CLI
    "RUF",
]
ignore = [
    "B008",     # function call in default argument: pydantic Field() idiom
]

[tool.ruff.lint.per-file-ignores]
# The CLI and the demo server are the two places where writing to a console is
# the actual job.
"catalog_scraper/cli.py" = ["T20"]
"demo_site/server.py" = ["T20"]
"scripts/*.py" = ["T20"]
# Tests assert on private helpers and use fixture arguments they do not read.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# An untyped decorator silently erases the signature of everything it wraps,
# which is how a "strict" codebase ends up with unchecked functions in it.
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true
